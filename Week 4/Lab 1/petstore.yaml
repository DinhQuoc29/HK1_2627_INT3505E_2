openapi: 3.0.3

info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ

servers:
  - url: http://localhost:5000/v1

security:
  - bearerAuth: []

tags:
  - name: tasks
    description: Quản lý công việc

paths:
  /tasks:
    get:
      tags:
        - tasks
      operationId: listTasks
      summary: Lấy danh sách tasks
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
      responses:
        '200':
          description: Danh sách tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - tasks
      operationId: createTask
      summary: Tạo task mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Tạo task thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags:
        - tasks
      operationId: getTask
      summary: Lấy thông tin một task
      responses:
        '200':
          description: Task được tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - tasks
      operationId: updateTask
      summary: Cập nhật một phần task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Cập nhật task thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - tasks
      operationId: deleteTask
      summary: Xóa task
      responses:
        '204':
          description: Xóa task thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: ID của task
      schema:
        type: integer
        format: int64
        minimum: 1

    PageLimit:
      name: limit
      in: query
      description: Số lượng task tối đa trả về
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PageOffset:
      name: offset
      in: query
      description: Vị trí bắt đầu lấy dữ liệu
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    StatusFilter:
      name: status
      in: query
      description: Lọc task theo trạng thái
      required: false
      schema:
        $ref: '#/components/schemas/TaskStatus'

    PriorityFilter:
      name: priority
      in: query
      description: Lọc task theo độ ưu tiên
      required: false
      schema:
        $ref: '#/components/schemas/TaskPriority'

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Hoàn thành tài liệu API
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-10-15'
        assignee:
          type: string
          nullable: true
          maxLength: 100
          example: Nguyen Van A
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-10-07T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-10-07T10:30:00Z'

    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Hoàn thành tài liệu API
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-10-15'
        assignee:
          type: string
          nullable: true
          maxLength: 100
          example: Nguyen Van A

    UpdateTaskInput:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Cập nhật tài liệu API
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-10-20'
        assignee:
          type: string
          nullable: true
          maxLength: 100
          example: Nguyen Van B

    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - DONE
      default: TODO
      example: IN_PROGRESS

    TaskPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
      default: MEDIUM
      example: HIGH

    TaskPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          format: int64
          minimum: 0
          example: 125
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: Title không được để trống

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa xác thực hoặc JWT không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Dữ liệu không vượt qua validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Lỗi máy chủ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
